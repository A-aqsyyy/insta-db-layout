<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Instagram Clone</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/stories.css">
    <link rel="stylesheet" href="../css/post.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/comments.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <link rel="stylesheet" href="../css/messages.css">
    <link rel="stylesheet" href="../css/create-post.css">
    <link rel="stylesheet" href="../css/explore.css">
    <link rel="stylesheet" href="../css/saved.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-logo">Instagram</a>
            <div class="navbar-search">
                <input type="text" placeholder="Search">
            </div>
            <div class="navbar-links">
                <a href="../index.html" class="navbar-link"><span class="navbar-icon">&#8962;</span></a>
                <a href="explore.html" class="navbar-link"><span class="navbar-icon">&#8981;</span></a>
                <a href="create-post.html" class="navbar-link"><span class="navbar-icon">+</span></a>
                <a href="notifications.html" class="navbar-link"><span class="navbar-icon">&#9825;</span></a>
                <a href="messages.html" class="navbar-link"><span class="navbar-icon">&#9993;</span></a>
                <a href="login.html" class="navbar-link">Login</a>
                <a href="signup.html" class="navbar-link">Sign up</a>
                <a href="profile.html" class="navbar-profile active"><img class="navbar-avatar" src="https://i.pravatar.cc/100?img=1" alt="Tahrim"></a>
            </div>
        </div>
    </nav>

    <main class="profile-page">
        <section class="profile-header">
            <img src="https://i.pravatar.cc/150?img=1" alt="Tahrim profile picture" class="profile-avatar">
            <div class="profile-info">
                <div class="profile-top">
                    <h1 class="profile-username">tahrim</h1>
                    <div class="profile-actions">
                        <button type="button" class="profile-button">Edit Profile</button>
                        <button type="button" class="profile-button follow">Follow</button>
                        <button type="button" class="profile-button">Message</button>
                    </div>
                </div>

                <div class="profile-stats">
                    <div class="profile-stat">
                        <strong>5</strong>
                        <span>Posts</span>
                    </div>
                    <div class="profile-stat">
                        <strong>120</strong>
                        <span>Followers</span>
                    </div>
                    <div class="profile-stat">
                        <strong>80</strong>
                        <span>Following</span>
                    </div>
                </div>

                <div class="profile-bio">
                    <h2 class="profile-name">Tahrim Jamal</h2>
                    <p>Web Developer</p>
                    <p>Building web applications and learning new technologies.</p>
                </div>
            </div>
        </section>

        <section class="profile-posts">
            <h2>Posts</h2>

            <article class="profile-post">
                <img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72" alt="Workspace post">
                <div class="profile-post-overlay">
                    <span>Likes</span>
                    <span>Comments</span>
                </div>
            </article>

            <article class="profile-post">
                <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32" alt="Photography post">
                <div class="profile-post-overlay">
                    <span>Likes</span>
                    <span>Comments</span>
                </div>
            </article>

            <article class="profile-post">
                <img src="https://images.unsplash.com/photo-1558655146-d09347e92766" alt="UI design post">
                <div class="profile-post-overlay">
                    <span>Likes</span>
                    <span>Comments</span>
                </div>
            </article>
        </section>
    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
