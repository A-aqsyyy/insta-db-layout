<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Instagram Clone</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/stories.css">
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/comments.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/create-post.css">
    <link rel="stylesheet" href="css/explore.css">
    <link rel="stylesheet" href="css/saved.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Instagram</a>
            <div class="navbar-search">
                <input type="text" placeholder="Search">
            </div>
            <div class="navbar-links">
                <a href="index.html" class="navbar-link"><span class="navbar-icon">&#8962;</span></a>
                <a href="pages/explore.html" class="navbar-link"><span class="navbar-icon">&#8981;</span></a>
                <a href="pages/create-post.html" class="navbar-link"><span class="navbar-icon">+</span></a>
                <a href="pages/notifications.html" class="navbar-link"><span class="navbar-icon">&#9825;</span></a>
                <a href="pages/messages.html" class="navbar-link"><span class="navbar-icon">&#9993;</span></a>
                <a href="login.html" class="navbar-link active">Login</a>
                <a href="signup.html" class="navbar-link">Sign up</a>
                <a href="pages/profile.html" class="navbar-profile"><img class="navbar-avatar" src="https://i.pravatar.cc/100?img=1" alt="Tahrim"></a>
            </div>
        </div>
    </nav>
    <main class="auth-page">
        <section class="auth-container">
            <header class="auth-header">
                <h1>Instagram Clone</h1>
                <p>Login to your account</p>
            </header>

            <form class="auth-form login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="auth-button login-button">Login</button>
            </form>

            <footer class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </footer>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
