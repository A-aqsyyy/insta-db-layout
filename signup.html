<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Instagram Clone</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/stories.css">
    <link rel="stylesheet" href="css/post.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/comments.css">
    <link rel="stylesheet" href="css/notifications.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/create-post.css">
    <link rel="stylesheet" href="css/explore.css">
    <link rel="stylesheet" href="css/saved.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">Instagram</a>
            <div class="navbar-search">
                <input type="text" placeholder="Search">
            </div>
            <div class="navbar-links">
                <a href="index.html" class="navbar-link"><span class="navbar-icon">&#8962;</span></a>
                <a href="pages/explore.html" class="navbar-link"><span class="navbar-icon">&#8981;</span></a>
                <a href="pages/create-post.html" class="navbar-link"><span class="navbar-icon">+</span></a>
                <a href="pages/notifications.html" class="navbar-link"><span class="navbar-icon">&#9825;</span></a>
                <a href="pages/messages.html" class="navbar-link"><span class="navbar-icon">&#9993;</span></a>
                <a href="login.html" class="navbar-link">Login</a>
                <a href="signup.html" class="navbar-link active">Sign up</a>
                <a href="pages/profile.html" class="navbar-profile"><img class="navbar-avatar" src="https://i.pravatar.cc/100?img=1" alt="Tahrim"></a>
            </div>
        </div>
    </nav>
    <main class="auth-page">
        <section class="auth-container">
            <header class="auth-header">
                <h1>Instagram Clone</h1>
                <p>Create a new account</p>
            </header>

            <form class="auth-form signup-form">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="auth-button signup-button">Create Account</button>
            </form>

            <footer class="auth-footer">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </footer>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
